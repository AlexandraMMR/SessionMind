[project]
name = "session-mind-ai"
version = "0.1.0"
description = "Context-aware live briefing & post-conference trip-report agent for AWS re:Invent, built on the AWS Events API and Amazon Bedrock AgentCore."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0,<0.28.0",
  "mcp>=1.2.0,<2.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "boto3>=1.35.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<0.25.0",
  "moto>=5.0.0,<6.0.0",
]
webapp = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.32.0,<0.33.0",
  "markdown>=3.7,<3.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
